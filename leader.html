<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主揪｜無獨有偶，有你有偶</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><div class="topbar"><div><div class="brand">無獨有偶，有你有偶</div><div class="small">主揪矩陣填答</div></div><a class="btn" href="player.html">回玩家頁</a></div><div id="message" class="notice hidden"></div><section id="denied" class="card hidden"><h2>目前不是你的主揪畫面</h2><p>只有主持人指定的玩家才能在回合進行中使用這個頁面。</p></section><section id="workspace" class="grid hidden"><div class="card"><div class="toolbar"><div><div class="small">目前回合</div><h2 id="roundTitle">ROUND</h2></div><div><span id="placedCount" class="status-pill"></span></div></div><p class="small">點一個空白格，再從下方玩家號碼選擇要放入的人。已使用的號碼會反灰。</p><div class="matrix-wrap"><div id="matrix" class="matrix"></div></div></div><div class="card"><h3>玩家號碼</h3><div id="palette" class="player-palette"></div><div class="actions" style="margin-top:18px"><button id="clearSelected" class="btn">清除此格</button><button id="submit" class="btn blue">送出檢查</button></div></div></section></main><script type="module" src="leader.js"></script></body></html>
