<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主揪｜無獨有偶，有你有偶</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><div class="topbar"><div><div class="brand">無獨有偶，有你有偶</div><div class="small">主揪矩陣填答</div></div><a class="btn" href="index.html">回首頁</a></div><div id="message" class="notice hidden"></div>
<section id="accessCard" class="card hidden"><h2>主揪登入</h2><p>主揪不是玩家，不需要建立角色卡。請輸入主持人主控台提供的 6 位數主揪碼。</p><form id="leaderLoginForm" class="form"><div class="field"><label>主揪碼</label><input id="leaderCode" inputmode="numeric" maxlength="6" required autocomplete="one-time-code"></div><button class="btn primary" type="submit">進入主揪畫面</button></form></section>
<section id="waiting" class="card hidden"><h2>主揪已連線</h2><p>登入成功，請等待主持人開始回合。回合開始後，矩陣會自動出現。</p></section>
<section id="workspace" class="grid hidden"><div class="card"><div class="toolbar"><div><div class="small">目前回合</div><h2 id="roundTitle">ROUND</h2></div><div><span id="placedCount" class="status-pill"></span></div></div><p class="small">點一個空白格，再從下方玩家號碼選擇要放入的人。已使用的號碼會反灰。</p><div class="matrix-wrap"><div id="matrix" class="matrix"></div></div></div><div class="card"><h3>玩家號碼</h3><div id="palette" class="player-palette"></div><div class="actions" style="margin-top:18px"><button id="clearSelected" class="btn">清除此格</button><button id="submit" class="btn blue">送出檢查</button></div></div></section></main><script type="module" src="leader.js"></script></body></html>
