<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主揪｜無獨有偶，有你有偶</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><div class="topbar"><div><div class="brand">無獨有偶，有你有偶</div><div class="small">主揪矩陣填答</div></div><div id="connection" class="status-pill">連線中…</div></div><div id="message" class="notice hidden"></div>
<section id="waiting" class="card hidden"><h2>主揪準備完成</h2><p>你不列入玩家人數，也不站進矩陣。請等待主持人開始回合；回合開始後，矩陣填答畫面會自動出現。</p></section>
<section id="workspace" class="grid hidden"><div class="card"><div class="toolbar"><div><div class="small">目前回合</div><h2 id="roundTitle">ROUND</h2></div><div><span id="placedCount" class="status-pill"></span></div></div><p class="small">依照現場真人站位，先點一個矩陣格子，再從下方選擇要放入的玩家號碼。已使用的號碼會反灰。</p><div class="matrix-wrap"><div id="matrix" class="matrix"></div></div></div><div class="card"><h3>玩家號碼</h3><div id="palette" class="player-palette"></div><div class="actions" style="margin-top:18px"><button id="clearSelected" class="btn">清除此格</button><button id="submit" class="btn blue">送出檢查</button></div></div></section></main><script type="module" src="leader.js"></script></body></html>
