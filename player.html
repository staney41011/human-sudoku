<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩家｜無獨有偶，有你有偶</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><div class="topbar"><div><div class="brand">無獨有偶，有你有偶</div><div class="small">玩家畫面</div></div><div id="connection" class="status-pill">連線中…</div></div><div id="message" class="notice hidden"></div>
<section id="setupMissing" class="card hidden"><h2>Firebase 連線失敗</h2><p>請通知主持人檢查 Firebase Authentication 的 Anonymous 與 User creation 是否已啟用。</p></section>
<section id="loginCard" class="card hidden"><h2>加入遊戲</h2><form id="joinForm" class="form"><div class="field"><label>你的名字</label><input id="name" maxlength="30" required autocomplete="name"></div><div class="field"><label>你的興趣</label><input id="interest" maxlength="30" required placeholder="例如：羽球、旅行、唱歌"></div><div class="field"><label>你喜歡的顏色</label><input id="color" maxlength="20" required placeholder="例如：藍色"></div><button class="btn primary" type="submit">建立我的角色卡</button></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><button id="showRecover" class="btn" type="button">我已經登入過，要恢復原角色</button></section>
<section id="recoverCard" class="card hidden"><h2>恢復原角色</h2><form id="recoverForm" class="form"><div class="field"><label>玩家號碼</label><input id="recoverNumber" inputmode="numeric" required></div><div class="field"><label>主持人提供的恢復碼</label><input id="recoverCode" inputmode="numeric" maxlength="6" required></div><button class="btn primary" type="submit">恢復角色</button><button id="backJoin" class="btn" type="button">返回新玩家登入</button></form></section>
<section id="playerCard" class="card hidden"><div class="profile-card"><div><div class="small">你的玩家號碼</div><div id="myNumber" class="big-number">--</div></div><div id="myName" class="name"></div><div class="profile-meta"><div class="meta-box">🎯 興趣<strong id="myInterest"></strong></div><div class="meta-box">🎨 喜歡的顏色<strong id="myColor"></strong></div></div><div id="phaseText" class="notice"></div><div id="clues" class="clues hidden"></div></div></section>
</main><script type="module" src="player.js"></script></body></html>
