<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主控台｜無獨有偶，有你有偶</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><div class="topbar"><div><div class="brand">無獨有偶，有你有偶</div><div class="small">主持人主控台</div></div><div id="connection" class="status-pill">連線中…</div></div><div id="message" class="notice hidden"></div>
<section id="setupMissing" class="card hidden"><h2>Firebase 尚未設定</h2><p>先把 Firebase Web App 設定貼到 <code>firebase-config.js</code>，再重新開啟主控台。</p></section>
<section id="dashboard" class="grid hidden"><div class="grid cards" style="margin-top:0"><div class="card"><div class="small">目前玩家</div><div id="playerCount" class="kpi">0</div></div><div class="card"><div class="small">目前狀態</div><h2 id="phaseName">玩家登入</h2></div><div class="card"><div class="small">預計盤面</div><h2 id="matrixInfo">—</h2></div></div>
<div class="card"><h2>① 玩家登入</h2><div class="actions"><button id="lockJoin" class="btn">鎖定登入</button><button id="unlockJoin" class="btn">重新開放登入</button></div><div id="players" class="player-palette" style="margin-top:16px"></div></div>
<div class="card"><h2>② 自我介紹</h2><div class="actions"><button id="startIntro" class="btn primary">開始自我介紹</button><button id="prevIntro" class="btn">上一位</button><button id="nextIntro" class="btn">下一位</button></div><p id="introNow" class="small"></p></div>
<div class="card"><h2>③ 指定主揪</h2><div class="field"><label>選擇負責送出答案的玩家</label><select id="leaderSelect"></select></div><button id="setLeader" class="btn primary" style="margin-top:12px">指定為主揪</button><p id="leaderNow" class="small"></p></div>
<div class="card"><h2>④ 回合控制</h2><div class="actions"><button id="buildR1" class="btn primary">產生並開始第一回合</button><button id="buildR2" class="btn primary">產生並開始第二回合</button></div><p class="small">第一回合與第二回合都由主揪自行送出檢查。即使第一回合全藍，也要由主持人手動開第二回合。</p></div>
<div class="card"><h2>⑤ 玩家恢復登入</h2><div class="field"><label>玩家號碼</label><select id="recoverSelect"></select></div><button id="makeRecovery" class="btn">產生一次性恢復碼</button><div id="recoveryResult" class="notice hidden" style="margin-top:12px"></div></div>
<div class="card"><h2>⑥ 重置</h2><p class="small">會刪除本場所有玩家、題目與進度。正式活動中請小心使用。</p><button id="reset" class="btn red">清空整場遊戲</button></div></section></main><script type="module" src="admin.js"></script></body></html>
